name: Set up the build tools
description: Installs Qt, the MSVC compiler, CMake, Ninja and vcpkg for Sky Auto Piano.

inputs:
  qt-version:
    description: Qt version to install
    default: "6.12.*"

runs:
  using: composite
  steps:
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ inputs.qt-version }}
        host: windows
        target: desktop
        arch: win64_msvc2022_64
        cache: true

    - name: Set up the MSVC compiler
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Get CMake and Ninja
      uses: lukka/get-cmake@latest

    - name: Set up vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: 8f363bdc11359ede4bc51e5eb32a2617538049c8

    - name: Point the CMake presets at Qt
      shell: pwsh
      run: |
        "QT_ROOT=$env:QT_ROOT_DIR" >> $env:GITHUB_ENV
        "$env:QT_ROOT_DIR\bin" >> $env:GITHUB_PATH
